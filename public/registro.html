<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Oudmelo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-[#F3F4F4] text-[#152134] dark:bg-[#152134] dark:text-[#F3F4F4] flex items-center justify-center min-h-screen transition-colors duration-300 relative px-4">

    <!-- Botón flotante para cambiar tema -->
    <button id="btn-toggle-theme" class="absolute top-5 right-5 p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-800 transition shadow-sm" title="Cambiar tema">
        <i class="fa-solid fa-moon dark:hidden"></i>
        <i class="fa-solid fa-sun hidden dark:inline"></i>
    </button>

    <div class="bg-white dark:bg-slate-900/80 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 dark:border-slate-800">
        <div class="text-center mb-6">
            <a href="index.html" class="inline-flex flex-col items-center gap-2 group">
                <img src="/img/oudmelologo.jpeg" alt="Logo Oudmelo" class="h-16 w-16 rounded-2xl object-cover border border-slate-300 dark:border-slate-700 shadow-md group-hover:scale-105 transition">
                <span class="text-2xl font-black tracking-widest uppercase mt-1">Oud<span class="font-light text-[#5A5D62] dark:text-slate-400">melo</span></span>
            </a>
            <p class="text-[#5A5D62] dark:text-slate-400 text-xs mt-1 uppercase tracking-wider">Crear Nueva Cuenta</p>
        </div>

        <form id="form-registro" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-[#5A5D62] dark:text-slate-400 mb-1">Nombre completo</label>
                <input type="text" id="reg-nombre" required class="w-full px-4 py-2.5 rounded-xl bg-[#F3F4F4] dark:bg-[#152134] border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-slate-400 focus:outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-[#5A5D62] dark:text-slate-400 mb-1">Correo electrónico</label>
                <input type="email" id="reg-email" required class="w-full px-4 py-2.5 rounded-xl bg-[#F3F4F4] dark:bg-[#152134] border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-slate-400 focus:outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-[#5A5D62] dark:text-slate-400 mb-1">Contraseña</label>
                <input type="password" id="reg-password" required class="w-full px-4 py-2.5 rounded-xl bg-[#F3F4F4] dark:bg-[#152134] border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-slate-400 focus:outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-[#5A5D62] dark:text-slate-400 mb-1">Tipo de cuenta</label>
                <select id="reg-rol" class="w-full px-4 py-2.5 rounded-xl bg-[#F3F4F4] dark:bg-[#152134] border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-slate-400 focus:outline-none text-sm">
                    <option value="comprador">Soy Comprador</option>
                    <option value="comerciante">Soy Comerciante</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-[#152134] text-[#F3F4F4] dark:bg-[#F3F4F4] dark:text-[#152134] py-3 rounded-xl font-bold hover:opacity-90 transition shadow-sm tracking-wide">
                Registrarse
            </button>
        </form>

        <p class="text-center text-sm text-[#5A5D62] dark:text-slate-400 mt-6">
            ¿Ya tienes cuenta? <a href="login.html" class="font-bold text-[#152134] dark:text-[#F3F4F4] hover:underline">Inicia sesión</a>
        </p>
        <div class="text-center mt-3">
            <a href="index.html" class="text-xs text-[#5A5D62] hover:opacity-75"><i class="fa-solid fa-arrow-left mr-1"></i> Volver al catálogo</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
