<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Oudmelo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-[#F3F4F4] text-[#152134] dark:bg-[#0d1522] dark:text-[#F3F4F4] min-h-screen flex items-center justify-center p-4 transition-colors">

    <div class="w-full max-w-md bg-white dark:bg-[#152134] rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-8">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex flex-col items-center gap-2">
                <img src="/img/oudmelologo.jpeg" alt="Logo Oudmelo" class="h-14 w-14 rounded-2xl object-cover border border-slate-300 dark:border-slate-700 shadow-sm">
                <span class="text-2xl font-black tracking-widest uppercase">Oud<span class="font-light text-[#5A5D62] dark:text-slate-400">melo</span></span>
            </a>
            <p class="text-xs uppercase tracking-widest text-[#5A5D62] dark:text-slate-400 mt-2 font-semibold">Crear cuenta de cliente</p>
        </div>

        <form id="form-registro" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1.5">Nombre completo</label>
                <input type="text" id="nombre" required placeholder="Ej. Martín Silva"
                    class="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#0d1522] border border-slate-300 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-[#152134] dark:focus:ring-[#F3F4F4]">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1.5">Correo electrónico</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com"
                    class="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#0d1522] border border-slate-300 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-[#152134] dark:focus:ring-[#F3F4F4]">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-1.5">Contraseña</label>
                <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres"
                    class="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#0d1522] border border-slate-300 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-[#152134] dark:focus:ring-[#F3F4F4]">
            </div>

            <div id="mensaje-error" class="hidden text-sm text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 px-4 py-2.5 rounded-xl"></div>

            <button type="submit" class="w-full bg-[#152134] text-[#F3F4F4] dark:bg-[#F3F4F4] dark:text-[#152134] py-3 rounded-xl font-bold uppercase tracking-wider text-sm shadow-md hover:opacity-90 transition">
                Registrarme
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-[#5A5D62] dark:text-slate-400 space-y-2">
            <p>¿Ya tienes cuenta? <a href="login.html" class="font-bold text-[#152134] dark:text-[#F3F4F4] hover:underline">Inicia sesión</a></p>
            <p><a href="index.html" class="text-xs hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Volver al catálogo</a></p>
        </div>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('mensaje-error');

            errorDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    alert('Registro exitoso. Ahora puedes iniciar sesión.');
                    window.location.href = 'login.html';
                } else {
                    errorDiv.textContent = data.error || 'Error al registrarse';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Error de conexión con el servidor';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
