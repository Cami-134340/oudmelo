<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Comerciante - Oudmelo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-[#F3F4F4] text-[#152134] dark:bg-[#1b2a42] dark:text-[#F3F4F4] min-h-screen flex flex-col transition-colors duration-300">

    <header class="bg-white/90 dark:bg-[#152134]/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 group">
                <img src="/img/oudmelologo.jpeg" alt="Logo Oudmelo" class="h-10 w-10 rounded-xl object-cover border border-slate-300 dark:border-slate-700 shadow-sm group-hover:scale-105 transition">
                <div class="flex flex-col">
                    <span class="text-lg font-black tracking-widest uppercase leading-none">Panel Comerciante</span>
                    <span class="text-[9px] uppercase tracking-widest text-[#5A5D62] dark:text-slate-400 font-bold">Oudmelo</span>
                </div>
            </a>

            <nav class="flex items-center gap-4 text-sm font-medium">
                <button id="btn-toggle-theme" class="p-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-800 transition" title="Cambiar tema">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline"></i>
                </button>
                <a href="index.html" class="hover:opacity-75 transition"><i class="fa-solid fa-store mr-1"></i> Ver Catálogo</a>
                <button id="btn-logout" class="bg-rose-600 text-white px-3 py-1.5 rounded-xl hover:bg-rose-700 transition shadow-sm"><i class="fa-solid fa-power-off"></i></button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Columna Izquierda: Formulario Crear / Editar (5 columnas) -->
        <div class="lg:col-span-5 bg-white dark:bg-[#152134] p-7 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 sticky top-24">
            <div class="flex justify-between items-center mb-6">
                <h2 id="titulo-form-admin" class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> Añadir Perfume
                </h2>
                <button type="button" id="btn-cancelar-edicion" onclick="cancelarEdicion()" class="hidden text-xs text-rose-500 hover:underline font-bold uppercase">
                    Cancelar Edición
                </button>
            </div>

            <form id="form-nuevo-perfume" class="space-y-4">
                <input type="hidden" id="perf-id" value="">
                
                <div>
                    <label class="block text-xs font-semibold uppercase text-[#5A5D62] dark:text-slate-400 mb-1">Nombre del perfume</label>
                    <input type="text" id="perf-nombre" required class="w-full px-4 py-2.5 rounded-xl bg-[#F3F4F4] dark:bg-[#1b2a42] border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-slate-400 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-[#5A5D62] dark:text-slate-400 mb-1">Marca</label>
                    <input type="text" id="perf-marca" required class="w-full px-4 py-2.5 rounded-xl bg-[#F3F4F4] dark:bg-[#1b2a42] border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-slate-400 focus:outline-none text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-[#5A5D62] dark:text-slate-400 mb-1">Precio ($)</label>
                        <input type="number" step="0.01" id="perf-precio" required class="w-full px-4 py-2.5 rounded-xl bg-[#F3F4F4] dark:bg-[#1b2a42] border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-slate-400 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-[#5A5D62] dark:text-slate-400 mb-1">Stock</label>
                        <input type="number" id="perf-stock" required class="w-full px-4 py-2.5 rounded-xl bg-[#F3F4F4] dark:bg-[#1b2a42] border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-slate-400 focus:outline-none text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-[#5A5D62] dark:text-slate-400 mb-1">
                        Foto del Perfume <span id="nota-foto-opcional" class="hidden lowercase font-normal">(dejar vacío para mantener la actual)</span>
                    </label>
                    <input type="file" id="perf-img" accept="image/*" 
                        class="w-full text-sm text-[#5A5D62] dark:text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:uppercase file:bg-[#152134] file:text-[#F3F4F4] dark:file:bg-[#F3F4F4] dark:file:text-[#152134] hover:file:opacity-90 border border-slate-300 dark:border-slate-700 rounded-xl p-1.5 cursor-pointer bg-[#F3F4F4] dark:bg-[#1b2a42]">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-[#5A5D62] dark:text-slate-400 mb-1">Descripción Extendida</label>
                    <textarea id="perf-desc" rows="4" placeholder="Escribe las notas de salida, corazón, fondo y ocasión de uso..." class="w-full px-4 py-2.5 rounded-xl bg-[#F3F4F4] dark:bg-[#1b2a42] border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-slate-400 focus:outline-none text-sm"></textarea>
                </div>
                <button type="submit" id="btn-submit-perfume" class="w-full bg-[#152134] text-[#F3F4F4] dark:bg-[#F3F4F4] dark:text-[#152134] py-3 rounded-xl font-bold hover:opacity-90 transition shadow-sm tracking-wide uppercase text-xs">
                    Publicar Producto
                </button>
            </form>
        </div>

        <!-- Columna Derecha: Lista de Productos Publicados (7 columnas) -->
        <div class="lg:col-span-7 bg-white dark:bg-[#152134] p-7 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                <i class="fa-solid fa-boxes-stacked"></i> Productos en Catálogo
            </h2>
            
            <div id="lista-admin-perfumes" class="divide-y divide-slate-200 dark:divide-slate-800">
                <!-- Cargado dinámicamente por app.js -->
            </div>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
